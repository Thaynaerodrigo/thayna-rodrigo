<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite de Casamento</title>
  <link rel="icon" href="imagens/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="book-scene">
    <div class="book" id="book">
      <div class="page cover active" id="page-cover">
        <div class="front">
          <img src="imagens/capa.png" alt="Capa do convite">
          <button class="seal" id="openCover" type="button" aria-label="Abrir capa"></button>
        </div>
        <div class="back"></div>
      </div>

      <div class="page page1">
        <div class="front">
          <img src="imagens/abertura.png" alt="Abertura do convite">
        </div>
        <div class="back"></div>
      </div>

      <div class="page page2">
        <div class="front">
          <img src="imagens/save-the-date.png" alt="Save the date">
        </div>
        <div class="back"></div>
      </div>

      <div class="page page3">
        <div class="front">
          <img src="imagens/informacoes.png" alt="Informações">
        </div>
        <div class="back"></div>
      </div>

      <div class="page page4">
        <div class="front">
          <img src="imagens/interacoes.png" alt="Interações">
          <a class="hotspot map" href="https://maps.app.goo.gl/gxSKv5h6Tob6LF9M7" target="_blank" rel="noreferrer" aria-label="Google Maps"></a>
          <a class="hotspot presence" href="https://noivos.casar.com/thayna-e-rodrigo-2026-11-28/logon" target="_blank" rel="noreferrer" aria-label="Confirmação de presença"></a>
          <a class="hotspot gifts" href="https://noivos.casar.com/thayna-e-rodrigo-2026-11-28/logon" target="_blank" rel="noreferrer" aria-label="Lista de presentes"></a>
          <a class="hotspot manual" href="imagens/manual.png" target="_blank" rel="noreferrer" aria-label="Manual"></a>
          <a class="hotspot dress" href="imagens/dress-code.png" target="_blank" rel="noreferrer" aria-label="Dress Code"></a>
        </div>
        <div class="back"></div>
      </div>

      <div class="page page5">
        <div class="front">
          <img src="imagens/mensagem-final.png" alt="Mensagem final">
        </div>
        <div class="back"></div>
      </div>
    </div>
  </div>

  <audio id="musica" loop preload="auto"></audio>
  <button id="btnMusica" class="music-button" type="button" aria-label="Tocar música">🔊</button>

  <script src="js/script.js"></script>
</body>
</html>
